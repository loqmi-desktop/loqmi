name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Dependencies & PyInstaller
      run: |
        cd backend
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build FastAPI Backend
      run: |
        cd backend
        pyinstaller loqmi_backend.spec

    - name: Move Backend to Tauri
      run: |
        mkdir -p frontend/src-tauri/binaries/loqmi-backend-dist
        cp -R backend/dist/loqmi-backend frontend/src-tauri/binaries/loqmi-backend-dist/

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        pnpm install

    - name: Build Next.js Frontend
      run: |
        cd frontend
        pnpm build

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Verify Tauri App Build (Dry Run)
      run: |
        cd frontend
        pnpm tauri build --bundles app